---
- name: Configure monolithic application
  hosts: all
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Python dependencies
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Create application user
      ansible.builtin.user:
        name: monolith
        system: true
        shell: /bin/bash
        create_home: false

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/monolith
        state: directory
        owner: monolith
        group: monolith
        mode: "0755"

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/monolith/.venv
        creates: /opt/monolith/.venv/bin/python

    - name: Copy application
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: /opt/monolith/
        owner: monolith
        group: monolith
        mode: "0644"

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: /opt/monolith/requirements.txt
        virtualenv: /opt/monolith/.venv

    - name: Copy systemd service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/monolith.service"
        dest: /etc/systemd/system/monolith.service
        mode: "0644"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start monolith
      ansible.builtin.systemd:
        name: monolith
        enabled: true
        state: started